<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b20"><title>Fret Drift — a six-string drone instrument</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><b>FRET <em>DRIFT</em></b><small>SIX STRINGS. ENDLESS BETWEEN.</small></div><span id="status" role="status">音の出発点を決める</span><button id="edit">調弦 / 運指</button></header><section id="setup"><div class="intro"><span class="eyebrow">01 / ORIGIN</span><h1>ひとつの和音から、<br><i>どこまでも。</i></h1><p>チューニングと運指を選んで、音の漂流を始める。</p></div><div class="origin"><label>チューニング <select id="preset"><option>Standard</option><option>EADGCE</option><option>Drop D</option><option>DADGAD</option><option>Open D</option></select></label><div id="strings"></div><p id="error" role="alert"></p><button id="start" class="primary">ドローンを開始 ↗</button><small>左から6弦 → 1弦。x はミュート、0 は開放弦。</small></div></section><section id="instrument" hidden><div class="readout"><span class="eyebrow">LIVE / HARMONIC FIELD</span><h1 id="chord"></h1><span id="pitches"></span></div><div class="analysis"><label>調性的な解釈 <select id="interpretation" title="相対支持は比較用の指標です。正解の確率ではありません。" aria-label="調性的な解釈"></select></label><small id="keyhint"></small><div id="keyfield" aria-label="調性候補の相対支持"></div></div><canvas id="field" aria-label="6弦の音高・声部移動と共通音、実音の波形"></canvas><div class="transport"><button id="back">← 戻る</button><button id="stop">■ 停止</button><button id="resume">▶ 再開</button><span id="motion"></span></div><div class="autoplay"><button id="auto" disabled aria-pressed="false">AUTO PLAY OFF</button><label>Pace <output id="auto-pace-value">12s</output><input id="auto-pace" aria-label="Pace" type="range" min="4" max="30" step="1" value="12"></label><label>Wander <output id="auto-wander-value">50%</output><input id="auto-wander" aria-label="Wander" type="range" min="0" max="1" step="0.05" value="0.5"></label><label>Edge <output id="auto-edge-value">25%</output><input id="auto-edge" aria-label="Edge" type="range" min="0" max="1" step="0.05" value="0.25"></label><button id="migration" aria-pressed="true">Migration ON</button><small id="migration-status" role="status"></small><small id="autostatus" role="status">AUTO 停止 · まだ採用なし</small></div><div class="next"><div class="nexthead"><span class="eyebrow">NEXT / 次の響き</span><div><button id="normal" aria-pressed="true">通常</button><button id="edge" aria-pressed="false">キワキワ</button><button id="shuffle">↻</button></div></div><div id="candidates"></div></div></section><section class="sound"><div class="tabs"><button data-tab="tone" aria-pressed="true">音色</button><button data-tab="spectrum" aria-pressed="false">倍音の漂流</button><button data-tab="saturation" aria-pressed="false">Saturation</button><button data-tab="dream" aria-pressed="false">Dream Texture</button>
          <button data-tab="space" aria-pressed="false">空間</button><small>SPACE 再生/停止 · 1–4 採用 · ← 戻る · ESC 停止</small></div><div id="controls"></div></section><footer><span>FRET DRIFT / EXPERIMENTAL AMBIENT INSTRUMENT</span><span>音を選ぶ。あいだを聴く。</span></footer></main><script type="module" src="app.js"></script></body></html>
